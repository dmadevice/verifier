name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
          - name: clang-cl
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64 -T ClangCL
          - name: gcc
            os: ubuntu-24.04
            configure: -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
          - name: clang
            os: ubuntu-24.04
            configure: -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          - name: clang-asan-ubsan
            os: ubuntu-24.04
            configure: >-
              -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=RelWithDebInfo
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
              "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
              "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }}
      - name: build
        shell: bash
        run: cmake --build build --config Release --parallel
      - name: test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

  reproducible:
    name: msvc reproducible
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: two clean builds in different directories
        shell: bash
        run: |
          for d in build-a build-b; do
            cmake -S . -B $d -G "Visual Studio 17 2022" -A x64
            cmake --build $d --config Release --parallel --clean-first
          done
          sha256sum build-a/Release/verifier.exe build-b/Release/verifier.exe
          test "$(sha256sum < build-a/Release/verifier.exe)" = "$(sha256sum < build-b/Release/verifier.exe)"
